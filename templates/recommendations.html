<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Recommendations</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #7c5dfa;
            --secondary-color: #9d4edd;
            --accent-color: #ff61d2;
            --background-color: #120638;
            --text-color: #ffffff;
            --card-bg: rgba(45, 45, 68, 0.9);
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--background-color);
            background-image: 
                linear-gradient(45deg, 
                    rgba(124, 93, 250, 0.1) 0%, 
                    rgba(157, 78, 221, 0.1) 50%, 
                    rgba(255, 97, 210, 0.1) 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, var(--accent-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: fadeInUp 0.8s ease-out;
        }

        .song-list {
            max-height: 400px;
            overflow-y: auto;
            padding: 1rem;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
        }

        #currentSongItem {
            background: rgba(255, 255, 255, 0.08);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
        }

        #currentSongTitle {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 1.5rem 0;
        }

        button {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(124, 93, 250, 0.3);
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1rem 0;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .volume-container label {
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        .navigation {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        a {
            text-decoration: none;
            color: var(--text-color);
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .controls {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Recommended Songs Based on Your Mood</h1>
        <div class="song-list">
            <div id="currentSongItem">
                <div id="currentSongTitle"></div>
                <audio id="audioPlayer" controls>
                    <source id="audioSource" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
                <div class="progress-container">
                    <input type="range" id="progressBar" value="0" max="100">
                    <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="playPauseButton">
                <span class="button-icon">▶️</span>
                <span>Play</span>
            </button>
            <button id="nextButton">
                <span class="button-icon">⏭️</span>
                <span>Next</span>
            </button>
        </div>

        <div class="volume-container">
            <label for="volumeControl">Volume</label>
            <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="navigation">
            <a href="{{ url_for('chat') }}">
                <span>💭</span>
                Back to Chat
            </a>
            <a href="{{ url_for('camera1') }}">
                <span>😊</span>
                Back to Emotion Detection
            </a>
        </div>
    </div>

    <script>
        const songs = {{ recommended_songs | tojson }};
        const audioPlayer = document.getElementById('audioPlayer');
        const audioSource = document.getElementById('audioSource');
        const progressBar = document.getElementById('progressBar');
        const playPauseButton = document.getElementById('playPauseButton');
        const nextButton = document.getElementById('nextButton');
        const currentSongTitle = document.getElementById('currentSongTitle');
        const currentTime = document.getElementById('currentTime');
        const totalTime = document.getElementById('totalTime');
        const volumeControl = document.getElementById('volumeControl');
        let currentSongIndex = 0;

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${min}:${sec}`;
        }

        function playCurrentSong() {
            if (songs.length > 0) {
                currentSongTitle.textContent = songs[currentSongIndex];
                audioSource.src = "{{ url_for('static', filename='audio/') }}" + songs[currentSongIndex].replace(' ', '_') + '.mp3';
                audioPlayer.load();
                audioPlayer.play().then(() => {
                    playPauseButton.textContent = "Pause";
                }).catch(err => console.error('Error playing audio:', err));
            }
        }

        function updateProgress() {
            progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            currentTime.textContent = formatTime(audioPlayer.currentTime);
            totalTime.textContent = formatTime(audioPlayer.duration);
        }

        playPauseButton.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playPauseButton.textContent = "Pause";
            } else {
                audioPlayer.pause();
                playPauseButton.textContent = "Play";
            }
        });

        nextButton.addEventListener('click', () => {
            if (currentSongIndex < songs.length - 1) {
                currentSongIndex++;
                playCurrentSong();
            } else {
                alert('You have reached the end of the playlist!');
            }
        });

        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', () => {
            if (currentSongIndex < songs.length - 1) {
                currentSongIndex++;
                playCurrentSong();
            } else {
                alert('You have reached the end of the playlist!');
            }
        });

        progressBar.addEventListener('input', () => {
            audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
        });

        // Adjust volume
        volumeControl.addEventListener('input', () => {
            audioPlayer.volume = volumeControl.value;
        });

        window.onload = () => {
            playCurrentSong();
            audioPlayer.addEventListener('loadedmetadata', () => {
                totalTime.textContent = formatTime(audioPlayer.duration);
            });
        };
    </script>
</body>

</html>
